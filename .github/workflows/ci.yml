# Mandi Khata CI: every push to main and every pull request.
#
# - check:    format, generated code up to date, analyze, all Dart/Flutter tests
# - database: migrations + seed on a fresh Postgres, pgTAP RLS tests, db lint
# - build-*:  the four shipped platforms. Windows is ONLY built here
#             (windows-latest); it is never built on the macOS dev machine.
#
# Builds use no .env file: the app compiles without backend keys and simply
# runs unconfigured. No secrets are needed by this workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the version in docs/decisions.md.
  FLUTTER_VERSION: '3.47.5'

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get packages (pub workspace)
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Generated code is up to date
        working-directory: apps/mandi_khata_app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- . ':(exclude)*.lock'
      - name: Analyze
        run: flutter analyze
      - name: khata_core tests
        working-directory: packages/khata_core
        run: dart test
      - name: mk_ui tests
        working-directory: packages/mk_ui
        run: flutter test
      - name: App tests
        working-directory: apps/mandi_khata_app
        # Shared runners are slower than a laptop: the performance test
        # (lists < 100 ms, reports < 2 s) allows 3x here.
        env:
          MK_PERF_SLACK: '3'
        run: flutter test

  database:
    name: Supabase migrations + RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Postgres
        run: supabase db start
      - name: Apply migrations and seed from scratch
        run: supabase db reset
      - name: pgTAP tests
        run: supabase test db
      - name: Lint
        run: supabase db lint --fail-on error

  sync-e2e:
    name: Two-device sync test (local Supabase stack)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Start the local stack (database, auth, API)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,mailpit
      - name: Two devices create lots offline, then sync
        run: scripts/hardening/two_device_sync.sh

  build-web:
    name: Build web
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: apps/mandi_khata_app
        run: flutter build web --release

  build-android:
    name: Build Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: apps/mandi_khata_app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/mandi_khata_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-macos:
    name: Build macOS
    needs: check
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: apps/mandi_khata_app
        run: flutter build macos --debug

  build-windows:
    name: Build Windows
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: apps/mandi_khata_app
        run: flutter build windows --release
      # The shop-counter build to try on a real Windows PC before the pilot.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: apps/mandi_khata_app/build/windows/x64/runner/Release/
          retention-days: 7
