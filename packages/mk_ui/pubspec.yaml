name: mk_ui
description: "Mandi Khata design system: tokens, theme and reusable widgets."
version: 0.0.1
publish_to: "none"
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  khata_core:
    path: ../khata_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  # Bundled so the app renders correctly offline (no google_fonts).
  # Licences: assets/fonts/OFL-IBMPlex.txt, assets/fonts/OFL-Noto.txt
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansGurmukhi
      fonts:
        - asset: assets/fonts/NotoSansGurmukhi-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansGurmukhi-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansGurmukhi-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansGurmukhi-Bold.ttf
          weight: 700
