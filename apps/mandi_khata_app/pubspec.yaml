name: mandi_khata_app
description: "Mandi Khata — offline-first khata app for arhtiyas and agri-input vendors."
publish_to: "none"
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  archive: ^4.3.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  dart_jsonwebtoken: ^3.4.1
  decimal: ^3.2.6
  drift: ^2.35.0
  drift_sqlite_async: ^0.3.1
  file_picker: ^13.1.0
  file_saver: ^0.6.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  http: ^1.6.0
  image: ^4.10.2
  image_picker: ^1.2.4
  intl: ^0.20.2
  json_annotation: ^4.12.0
  khata_core:
    path: ../../packages/khata_core
  local_auth: ^3.0.2
  logging: ^1.3.0
  mk_ui:
    path: ../../packages/mk_ui
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  powersync: ^2.4.0
  printing: ^5.15.1
  riverpod_annotation: ^4.0.7
  sentry_flutter: ^9.30.1
  # Pinned: sqlite3_web 0.9.5 made WorkerDatabase `base`, which breaks the web
  # build of sqlite_async 0.14.5 (used by powersync). Lift once sqlite_async
  # supports it — see docs/decisions.md (2026-09-30).
  shared_preferences: ^2.5.5
  sqlite3_web: 0.9.4
  sqlite_async: ^0.14.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0
  xml: ^7.1.0

flutter:
  uses-material-design: true
  generate: true
