# PowerSync Sync Streams for Mandi Khata (deploy in the PowerSync dashboard
# or with the PowerSync CLI). Every synced table must also be in the
# `powersync` publication (supabase/migrations/*_powersync_publication.sql),
# the app's PowerSync schema (lib/core/db/powersync_schema.dart) and the
# Drift tables (lib/core/db/tables.dart).
#
# Access mirrors the RLS policies: a user gets every business they are an
# ACTIVE member of. Deactivating a member removes that business's data from
# their devices on the next sync.

config:
  edition: 3

streams:
  # Everything a member works with, for every business they belong to.
  tenant_data:
    auto_subscribe: true
    with:
      my_tenants: >-
        SELECT tenant_id FROM tenant_members
        WHERE user_id = auth.user_id() AND is_active = true
    queries:
      - SELECT * FROM tenants WHERE id IN my_tenants
      - SELECT * FROM tenant_members WHERE tenant_id IN my_tenants
      - SELECT * FROM devices WHERE tenant_id IN my_tenants
      - SELECT * FROM settings WHERE tenant_id IN my_tenants
      - SELECT * FROM parties WHERE tenant_id IN my_tenants
      - SELECT * FROM party_roles WHERE tenant_id IN my_tenants
      - SELECT * FROM number_series WHERE tenant_id IN my_tenants
      - SELECT * FROM ledger_entries WHERE tenant_id IN my_tenants
      - SELECT * FROM crops WHERE tenant_id IN my_tenants
      - SELECT * FROM lots WHERE tenant_id IN my_tenants
      - SELECT * FROM payments WHERE tenant_id IN my_tenants
      # Karza: every member sees loans (the khata already shows the entries);
      # issuing and changing them is loans.manage (RLS).
      - SELECT * FROM loans WHERE tenant_id IN my_tenants
      - SELECT * FROM loan_rate_changes WHERE tenant_id IN my_tenants
      # Posted interest and waivers (the khata entries behind them sync above).
      - SELECT * FROM interest_postings WHERE tenant_id IN my_tenants
      # Vouchers (step 3.2): their khata and cash lines sync to everyone
      # anyway; bank lines and the journal stay in finance_data.
      - SELECT * FROM vouchers WHERE tenant_id IN my_tenants
      # Cash counts at day close (step 3.3): the cash book is everyone's.
      - SELECT * FROM cash_counts WHERE tenant_id IN my_tenants
      # Expenses (step 3.4): a munshi pays palledari in cash too. Bank lines
      # of bank expenses stay in finance_data.
      - SELECT * FROM expense_categories WHERE tenant_id IN my_tenants
      - SELECT * FROM recurring_expenses WHERE tenant_id IN my_tenants
      - SELECT * FROM expenses WHERE tenant_id IN my_tenants
      # Input shop (phase 4). The counter works offline, so every member gets
      # the catalogue, stock and the sales / returns. Purchases (supplier
      # terms and costs) are finance data: finance_data stream.
      - SELECT * FROM product_categories WHERE tenant_id IN my_tenants
      - SELECT * FROM products WHERE tenant_id IN my_tenants
      - SELECT * FROM batches WHERE tenant_id IN my_tenants
      - SELECT * FROM stock_movements WHERE tenant_id IN my_tenants
      - SELECT * FROM shop_sales WHERE tenant_id IN my_tenants
      - SELECT * FROM shop_sale_lines WHERE tenant_id IN my_tenants
      - SELECT * FROM shop_returns WHERE tenant_id IN my_tenants
      - SELECT * FROM shop_return_lines WHERE tenant_id IN my_tenants
      # Phase 5: the subscription (it decides read-only mode offline), plan
      # change requests, and read-only support access to this business.
      - SELECT * FROM tenant_subscriptions WHERE tenant_id IN my_tenants
      - SELECT * FROM plan_requests WHERE tenant_id IN my_tenants
      - SELECT * FROM support_sessions WHERE tenant_id IN my_tenants
      # Everyone gets the Cash account and its book lines; bank accounts and
      # their lines go only to finance members (stream below).
      - SELECT * FROM bank_accounts WHERE tenant_id IN my_tenants AND kind = 'cash'
      - SELECT * FROM cash_bank_entries WHERE tenant_id IN my_tenants AND account_kind = 'cash'

  # Bank accounts and the bank book: finance details (RLS: finance.view).
  # Sync streams cannot evaluate custom permission overrides, so this follows
  # the default roles (owner, accountant) — see docs/decisions.md.
  finance_data:
    auto_subscribe: true
    with:
      finance_tenants: >-
        SELECT tenant_id FROM tenant_members
        WHERE user_id = auth.user_id() AND is_active = true
        AND (role = 'owner' OR role = 'accountant')
    queries:
      - SELECT * FROM bank_accounts WHERE tenant_id IN finance_tenants AND kind = 'bank'
      - SELECT * FROM cash_bank_entries WHERE tenant_id IN finance_tenants AND account_kind = 'bank'
      - SELECT * FROM account_groups WHERE tenant_id IN finance_tenants
      - SELECT * FROM accounts WHERE tenant_id IN finance_tenants
      - SELECT * FROM journal_entries WHERE tenant_id IN finance_tenants
      - SELECT * FROM journal_lines WHERE tenant_id IN finance_tenants
      # Bank reconciliation (step 3.3).
      - SELECT * FROM bank_statement_lines WHERE tenant_id IN finance_tenants
      - SELECT * FROM bank_reconciliations WHERE tenant_id IN finance_tenants
      # Purchases and their returns (phase 4): RLS is finance.view or
      # purchases.create; like above, default roles (owner, accountant).
      - SELECT * FROM purchases WHERE tenant_id IN finance_tenants
      - SELECT * FROM purchase_lines WHERE tenant_id IN finance_tenants
      - SELECT * FROM purchase_returns WHERE tenant_id IN finance_tenants
      - SELECT * FROM purchase_return_lines WHERE tenant_id IN finance_tenants
      # Closed years carry the year's profit: finance members only. Other
      # devices are refused by the server (lock trigger) if they post there.
      - SELECT * FROM financial_years WHERE tenant_id IN finance_tenants

  # Names of the people you work with (users screen, audit log, receipts).
  team_profiles:
    auto_subscribe: true
    query: >-
      SELECT * FROM app_users
      WHERE id IN (
        SELECT user_id FROM tenant_members
        WHERE tenant_id IN (
          SELECT tenant_id FROM tenant_members
          WHERE user_id = auth.user_id() AND is_active = true
        )
      )

  # The audit log is written by everyone but downloaded only by owners
  # (RLS: audit.view). Sync streams cannot filter by time, so owners get the
  # full log rather than the last 30 days — see docs/decisions.md.
  owner_audit:
    auto_subscribe: true
    with:
      owned_tenants: >-
        SELECT tenant_id FROM tenant_members
        WHERE user_id = auth.user_id() AND role = 'owner' AND is_active = true
    query: SELECT * FROM audit_log WHERE tenant_id IN owned_tenants

  # Pending invitations: owners only (RLS: admin.manage). Same default-role
  # limit as the other owner streams.
  owner_invites:
    auto_subscribe: true
    with:
      owned_tenants_inv: >-
        SELECT tenant_id FROM tenant_members
        WHERE user_id = auth.user_id() AND role = 'owner' AND is_active = true
    query: SELECT * FROM member_invites WHERE tenant_id IN owned_tenants_inv

  # Same for everyone: plans (what each includes), add-ons, the public
  # platform settings (offline tolerance...) and announcements. Nothing
  # private belongs here. Subscription state for a business is in tenant_data.
  platform_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM plans
      - SELECT * FROM plan_addons
      - SELECT * FROM platform_settings WHERE is_public = true
      - SELECT * FROM announcements WHERE is_active = true
